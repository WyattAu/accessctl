# ADR-0001 criterion 1: continuous conservation fuzz. Each nightly run is
# one window in the cumulative evidence (PROPTEST_CASES=4096 x 250-step
# walks, invariant asserted after every step).
name: nightly-soak
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROPTEST_CASES: "4096"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.8.1
      - name: conservation soak
        run: cargo test --lib grants

# WyattAu dependency governance — cargo-deny configuration.
# Copy to the repo root. Policies: see engineering-standards README §7.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2023-0071 + RUSTSEC-2026-0387: timing side channels in the
    # RSA/JWT stack pulled in by the optional `tokenkit` feature. Estate
    # usage is non-adversarial (first-party service tokens, no
    # unauthenticated callers of the RSA path). Tracked for upstream
    # remediation: pattern-standards adr/0001 evidence + SECURITY.md.
    "RUSTSEC-2023-0071",
    "RUSTSEC-2026-0387",
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
